name: Auto Update Scholar and GitHub Data

on:
  schedule:
    # Esegue l'aggiornamento automatico ogni lunedì a mezzanotte (UTC)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Permette di eseguire l'Action manualmente dall'interfaccia di GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Update Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCRAPINGBEE_KEY: ${{ secrets.SCRAPINGBEE_KEY }}
        run: python update_data.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/scholar_github.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update scholar and github data" && git push)
