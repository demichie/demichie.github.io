name: Auto Update Scholar and GitHub Data

on:
  schedule:
    # Ogni lunedi' a mezzanotte UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Versione esplicita per evitare che "3.x" cambi comportamento nel tempo.
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Update Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pausa casuale tra le due fasi Scholar (secondi).
          SCHOLAR_DELAY_MIN: '90'
          SCHOLAR_DELAY_MAX: '180'
        run: python update_data.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add data/scholar_github.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update scholar and github data"
            git push
          else
            echo "No data changes to commit."
          fi
